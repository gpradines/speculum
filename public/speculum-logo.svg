<svg width="600" height="120" viewBox="0 0 300 60" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Speculum logo">
  <title>Speculum Logo</title>
  <defs>
    <clipPath id="speculum-logo-planet-clip">
      <circle cx="27" cy="27" r="17" />
    </clipPath>
    <style>
      .planet-ring-back,
      .planet-ring-front {
        fill: #f8fafc;
        stroke: #1e3a5f;
        stroke-width: 1.1px;
        paint-order: stroke;
      }
      .planet-rim {
        stroke: rgba(15, 23, 42, 0.35);
      }
      .planet-star {
        fill: #1e3a5f;
      }
      .wordmark {
        stroke: #0f172a;
      }
      @media (prefers-color-scheme: dark) {
        .planet-ring-back,
        .planet-ring-front {
          fill: #efeae0;
          stroke: transparent;
        }
        .planet-rim {
          stroke: rgba(239, 234, 224, 0.22);
        }
        .planet-star {
          fill: #efeae0;
        }
        .wordmark {
          stroke: #efeae0;
        }
      }
    </style>
  </defs>

  <!-- Ringed Earth Planet & Star -->
  <g transform="translate(6, 4)">
    <g transform="translate(27 27) rotate(-29)">
      <path class="planet-ring-back" d="M -26 0 A 26 7.4 0 0 1 26 0 A 26 6.2 0 0 0 -26 0 Z" />
    </g>
    <g clip-path="url(#speculum-logo-planet-clip)">
      <circle cx="27" cy="27" r="17" fill="#0d1e3a" />
      <circle cx="21" cy="21" r="18" fill="#4670ab" />
      <circle cx="15.5" cy="15.5" r="13" fill="#7aa1d4" />
      <path d="M 10.5 29 C 9.5 20.5 14 12.5 23 10.5 C 26 9.9 29.5 10.1 32 11 C 26 11.4 20 14 16 18.5 C 12.2 22.8 11 26.2 10.5 29 Z" fill="#efeae0" />
      <path d="M 28 15 C 31 15 34 16 35 18 C 33.5 19.5 34 21 37 22 C 40 23 43.5 26 44 31 C 44 38 37 44 28 44 C 24 44 21 42 20 39 C 19 36 22 34 24 33 C 26 32 25 29 23 27.5 C 21 26 22 23 24.5 22 C 27 21 26 18 28 15 Z" fill="#0d1e3a" opacity="0.92" />
      <path d="M 15 21 C 17 19.5 20 20 21 22 C 21.5 23.5 19.5 25 18 25.5 C 16.5 26 14 23.5 15 21 Z" fill="#13294b" opacity="0.85" />
      <path d="M 13 24.5 C 14.5 23.5 16.5 23.5 17.5 24.5 C 16 25.5 14.5 26 13 24.5 Z" fill="#efeae0" opacity="0.92" />
      <path d="M 18.5 15.5 C 21 14 24 14 25.5 15 C 23.5 16.2 21 16.5 18.5 15.5 Z" fill="#efeae0" opacity="0.9" />
    </g>
    <circle class="planet-rim" cx="27" cy="27" r="16.7" fill="none" stroke-width="0.9" />
    <g transform="translate(27 27) rotate(-29)">
      <path class="planet-ring-front" d="M -26 0 A 26 8.3 0 0 0 26 0 A 26 5.8 0 0 1 -26 0 Z" />
    </g>
    <path class="planet-star" d="M 53 2 L 54.4 8.6 L 61 10 L 54.4 11.4 L 53 18 L 51.6 11.4 L 45 10 L 51.6 8.6 Z" />
  </g>

  <!-- SPECULUM Geometric Vector Wordmark -->
  <g class="wordmark" transform="translate(87, 20) scale(0.95)">
    <path d="M 19 2 L 7 2 A 4.5 4.5 0 0 0 2.5 6.5 A 4.5 4.5 0 0 0 7 11 L 15 11 A 4.5 4.5 0 0 1 19.5 15.5 A 4.5 4.5 0 0 1 15 20 L 2 20" stroke-width="2.4" stroke-linecap="butt" stroke-linejoin="round" />
    <path d="M 29.5 21.2 L 29.5 2 L 41.5 2 A 4.5 4.5 0 0 1 46 6.5 A 4.5 4.5 0 0 1 41.5 11 L 29.5 11" stroke-width="2.4" stroke-linecap="butt" stroke-linejoin="round" />
    <path d="M 55.5 2 L 72.5 2 M 55.5 11 L 72.5 11 M 55.5 20 L 72.5 20" stroke-width="2.4" stroke-linecap="butt" />
    <path d="M 100 2 L 88.5 2 A 6 6 0 0 0 82.5 8 L 82.5 14 A 6 6 0 0 0 88.5 20 L 100 20" stroke-width="2.4" stroke-linecap="butt" stroke-linejoin="round" />
    <path d="M 109.5 0.8 L 109.5 14 A 6 6 0 0 0 115.5 20 L 122 20 A 6 6 0 0 0 128 14 L 128 0.8" stroke-width="2.4" stroke-linecap="butt" stroke-linejoin="round" />
    <path d="M 138.5 0.8 L 138.5 20 L 155 20" stroke-width="2.4" stroke-linecap="butt" stroke-linejoin="miter" />
    <path d="M 163.5 0.8 L 163.5 14 A 6 6 0 0 0 169.5 20 L 176 20 A 6 6 0 0 0 182 14 L 182 0.8" stroke-width="2.4" stroke-linecap="butt" stroke-linejoin="round" />
    <path d="M 192.5 21.2 L 192.5 2 L 194 2 L 203 17.5 L 212 2 L 213.5 2 L 213.5 21.2" stroke-width="2.4" stroke-linecap="butt" stroke-linejoin="round" />
  </g>
</svg>
